server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # EN legal pages are not translated — 302 back to the ZH version.
    # Real 302 so crawlers get Location on the first hop, no JS dependency.
    # Must be authoritative (RULE 8 doesn't apply: this is a build asset in
    # the portal repo, not a K8s manifest) — the client-side ZhOnlyGuard
    # fallback only covers vite dev/preview or if this rule is ever removed.
    location ~ ^/en/(privacy|legal|cookies|legal-center)/?$ {
        return 302 /$1;
    }

    # /api/ is routed by K8s Ingress to web-api service — no proxy_pass here
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
